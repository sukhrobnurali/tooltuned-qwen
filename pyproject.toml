[project]
name = "tooltuned-qwen"
version = "0.1.0"
description = "Qwen 3.5 4B LoRA fine-tune for tool-calling, evaluated on BFCL V4."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sukhrob Nurali", email = "sukhrobnurali@gmail.com" },
]
keywords = ["qwen", "lora", "fine-tuning", "tool-calling", "bfcl", "function-calling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

# Light deps only — anything imported by the lint/type/test path on a CPU box.
# Heavy ML stack lives behind the `colab` extra so CI stays fast.
dependencies = [
    "pydantic>=2.8,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Installed on Colab L4 via `pip install -e .[colab]`.
# Pins per docs/decisions/0002-pinned-versions.md.
colab = [
    "unsloth>=2026.2.1",
    "unsloth_zoo>=2026.2.1",
    "transformers>=5.1.0,<6",
    "trl>=0.20,<0.25",
    "peft>=0.18,<0.20",
    "bitsandbytes>=0.48",
    "accelerate>=1.5,<2",
    "datasets>=3.5,<4",
    "huggingface_hub>=1.3,<2",
    "torch>=2.6,<2.8",
    "wandb>=0.18",
]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "pyright>=1.1.380",
    # Phase 4.3 comparison artifacts -- the bar chart embedded in the model
    # card (brief 11 q13) renders locally from saved BFCL results. Colab
    # pre-installs matplotlib by default so the `[colab]` extra doesn't need it.
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/sukhrobnurali/tooltuned-qwen"
Repository = "https://github.com/sukhrobnurali/tooltuned-qwen"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tooltuned_qwen"]

# `colab` (heavy GPU stack) and `dev` (local CPU lint+test) target different
# machines and have incompatible transitive constraints (e.g. unsloth pins trl
# below the version transformers v5 wants). Declare them as conflicting so uv
# resolves each extra in isolation; the Colab notebook installs `[colab]`
# fresh, and CI/local installs only `[dev]`.
[tool.uv]
conflicts = [
    [
        { extra = "colab" },
        { extra = "dev" },
    ],
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "outputs", "results", "wandb"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "outputs", "results", "wandb", "notebooks"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
