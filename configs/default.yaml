# Default training config -- the Phase 3 main run.
# ADR 0003 (dataset = xlam) and ADR 0004 (thinking-mode = preserve) are baked in.
# Phase 3 sizing notes:
#   * max_samples=10000 -- first attempt fits comfortably under 25 A100 units.
#     Bump to null (full 60k) only if budget allows after the 10k pass.
#   * batch_size=16 / grad_accum=1 / max_seq_len=2048 -- A100 headroom (S4 used
#     ~14 / 40 GB at bs=8/ga=2/seq=1024). Effective batch unchanged at 16.
#   * wandb_project routes logging to the public dashboard at
#     wandb.ai/sukhrobnurali/tooltuned-qwen.
run_name: tooltuned-qwen-default
base_model: Qwen/Qwen3.5-4B
seed: 42

data:
  sources:
    - xlam
  max_samples: 10000
  val_frac: 0.05
  holdout_frac: 0.05

max_seq_len: 2048
packing: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

optimizer:
  name: adamw_8bit
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0

batch_size: 16
grad_accum_steps: 1
epochs: 1
max_steps: null

thinking_mode: preserve

wandb_project: tooltuned-qwen
# Pin the W&B entity explicitly. If null, the run lands on the account's
# default entity (which on the first Phase 3 run was `sukhrob-production`,
# a private team workspace -- the model card link 404'd as a result).
# Set to your *public* personal entity before any future run that wants a
# public dashboard. Leave null to opt out of the dashboard link entirely.
wandb_entity: null

output_dir: outputs
